# Local git hooks — fast checks only. CI remains the merge gate (tests, knip, e2e, drift).
# Install: automatic in `nix develop` (see flake.nix). Manual: `lefthook install`

pre-commit:
  parallel: true
  commands:
    ultracite:
      glob:
        - "*.{ts,tsx,js,mjs,json,yml,yaml,md}"
        - "**/*.{ts,tsx,js,mjs,json,yml,yaml,md}"
      run: pnpm check
    agents-md:
      glob: "{AGENTS.md,**/AGENTS.md}"
      run: pnpm check:agents:strict
    agents-script:
      glob: "scripts/check-agents.mjs"
      run: pnpm check:agents:strict

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    web-ds:
      glob: "apps/web/**"
      run: pnpm --filter @watchdog/web ds:check

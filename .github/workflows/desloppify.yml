# Desloppify — holistic codebase health scanner (mechanical dimensions in CI).
# Advisory only: reports scores, does not fail the check.
#
# Docs: https://github.com/peteromallet/desloppify

name: Desloppify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: desloppify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desloppify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desloppify
        run: pip install --upgrade "desloppify[full]"

      - name: Apply exclude patterns
        run: bash scripts/desloppify-bootstrap.sh

      - name: Scan greenfield TypeScript (CI profile)
        run: desloppify --lang typescript scan --path . --profile ci --no-badge

      - name: Report status
        run: desloppify status --json | tee desloppify-status.json

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desloppify-status
          path: desloppify-status.json
          if-no-files-found: ignore
